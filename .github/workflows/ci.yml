name: Rust and HTTP checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: cargo build --locked --manifest-path server/Cargo.toml
      - run: python3 tests/smoke.py
      - run: cargo build --release --locked --manifest-path server/Cargo.toml
      - run: python3 tests/smoke.py
        env:
          MCP_TEST_BINARY: server/target/release/enisa-sme-mcp
